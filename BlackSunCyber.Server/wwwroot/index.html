<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackSun Cyber</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Inter:wght@300;400;500&display=swap');

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #07070f;
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

            /* Ambient glow background */
            body::before {
                content: '';
                position: fixed;
                width: 600px;
                height: 600px;
                background: radial-gradient(circle, rgba(243,156,18,0.08) 0%, transparent 70%);
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                pointer-events: none;
            }

        .logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #F39C12;
            text-shadow: 0 0 40px rgba(243,156,18,0.3);
            margin-bottom: 0.25em;
            text-align: center;
        }

        .tagline {
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #555570;
            margin-bottom: 4rem;
            text-align: center;
        }

        .cards {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 1rem;
        }

        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            width: 220px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s, background 0.2s, transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

            .card:hover {
                border-color: rgba(243,156,18,0.4);
                background: rgba(243,156,18,0.05);
                transform: translateY(-4px);
            }

        .card-icon {
            font-size: 2.5rem;
            line-height: 1;
        }

        .card-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .card-desc {
            font-size: 0.8rem;
            color: #666680;
            line-height: 1.5;
        }

        .card.admin .card-title {
            color: #F39C12;
        }

        .card.client .card-title {
            color: #2ECC71;
        }

        .card.admin {
            border-color: rgba(243,156,18,0.15);
        }

        .card.client {
            border-color: rgba(46,204,113,0.15);
        }

        .card.admin:hover {
            border-color: rgba(243,156,18,0.5);
            background: rgba(243,156,18,0.06);
        }

        .card.client:hover {
            border-color: rgba(46,204,113,0.5);
            background: rgba(46,204,113,0.06);
        }

        .footer {
            position: fixed;
            bottom: 1.5rem;
            font-size: 0.72rem;
            color: #333345;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="logo">BlackSun Cyber</div>
    <div class="tagline">Gaming Club Management</div>

    <div class="cards">
        <a href="/admin/" class="card admin">
            <div class="card-icon">⚙️</div>
            <div class="card-title">Admin</div>
            <div class="card-desc">Panou de control recepție — gestionează stațiile, timpul și încasările</div>
        </a>
        <a href="/client/" class="card client">
            <div class="card-icon">🎮</div>
            <div class="card-title">Gamer</div>
            <div class="card-desc">Cabinetul tău personal — urmărește timpul și cere prelungire</div>
        </a>
    </div>

    <div class="footer">BlackSun Cyber &nbsp;·&nbsp; v1.0</div>
</body>
</html>
